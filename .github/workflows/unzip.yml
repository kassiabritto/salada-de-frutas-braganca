name: unzip-site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplica atualizacoes
        run: |
          python3 patch.py eventos/index.html delivery/index.html
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git rm -q --cached patch.py || true
          rm -f patch.py
          git add -A
          git commit -m "Atualiza delivery" || true
          git push
