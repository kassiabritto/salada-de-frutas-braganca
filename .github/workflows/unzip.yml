name: unzip-site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplica atualizacoes
        run: |
          python3 patch2.py delivery/index.html
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          rm -f patch2.py
          git add -A
          git commit -m "Pix e endereco depois do envio do pedido" || true
          git push
